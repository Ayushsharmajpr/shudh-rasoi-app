{% extends "base.html" %}
{% set active_tab = "expenses" %}
{% block title %}Edit expense — {{ biz.business_name }}{% endblock %}

{% block content %}
<div class="topbar">
  <div class="page-title">Edit {{ e.expense_type|lower }} expense</div>
  <a href="{{ url_for('expenses') }}" class="today-badge">← All expenses</a>
</div>

<form class="entry-form" method="POST" action="{{ url_for('edit_expense', eid=e.id) }}">
  <div class="field">
    <label for="date">Date</label>
    <input type="date" id="date" name="date" value="{{ e.date }}" required>
  </div>
  <div class="field grow">
    <label for="category">Category</label>
    <select id="category" name="category" required>
      {% for c in categories %}<option value="{{ c }}" {{ 'selected' if e.category==c }}>{{ c }}</option>{% endfor %}
    </select>
  </div>
  <div class="field grow">
    <label for="description">Description</label>
    <input type="text" id="description" name="description" value="{{ e.description or '' }}">
  </div>
  <div class="field">
    <label for="amount">Amount ({{ cur }})</label>
    <input type="number" id="amount" name="amount" step="1" min="0" value="{{ e.amount }}" required>
  </div>
  <div class="field">
    <label for="payment_mode">Payment mode</label>
    <select id="payment_mode" name="payment_mode">
      {% for m in payment_modes %}<option value="{{ m }}" {{ 'selected' if e.payment_mode==m }}>{{ m }}</option>{% endfor %}
    </select>
  </div>
  <div class="field">
    <button class="btn" type="submit">Save changes</button>
  </div>
</form>
{% endblock %}
