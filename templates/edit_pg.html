{% extends "base.html" %}
{% set active_tab = "pgs" %}
{% block title %}Edit {{ pg.name }} — {{ biz.business_name }}{% endblock %}

{% block content %}
<div class="topbar">
  <div class="page-title">Edit PG</div>
  <a href="{{ url_for('pgs') }}" class="today-badge">← All PGs</a>
</div>

<form class="entry-form" method="POST" action="{{ url_for('edit_pg', pid=pg.id) }}" style="flex-direction:column; align-items:stretch;">
  <div style="display:flex; flex-wrap:wrap; gap:16px;">
    <div class="field grow">
      <label for="name">PG name</label>
      <input type="text" id="name" name="name" value="{{ pg.name }}" required>
    </div>
    <div class="field grow">
      <label for="address">Address</label>
      <input type="text" id="address" name="address" value="{{ pg.address or '' }}">
    </div>
  </div>
  <div style="display:flex; flex-wrap:wrap; gap:16px;">
    <div class="field">
      <label for="contact_person">Contact person</label>
      <input type="text" id="contact_person" name="contact_person" value="{{ pg.contact_person or '' }}">
    </div>
    <div class="field">
      <label for="contact_number">Contact number</label>
      <input type="text" id="contact_number" name="contact_number" value="{{ pg.contact_number or '' }}">
    </div>
  </div>
  <div class="field grow">
    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" rows="2">{{ pg.notes or '' }}</textarea>
  </div>
  <div>
    <button class="btn" type="submit">Save changes</button>
    <a href="{{ url_for('pgs') }}" class="btn secondary" style="text-decoration:none;">Cancel</a>
  </div>
</form>
{% endblock %}
