{% extends "base.html" %}
{% set active_tab = "savings" %}
{% block title %}Edit savings entry — {{ biz.business_name }}{% endblock %}

{% block content %}
<div class="topbar">
  <div class="page-title">Edit savings entry</div>
  <a href="{{ url_for('savings') }}" class="today-badge">← All savings</a>
</div>

<form class="entry-form" method="POST" action="{{ url_for('edit_savings', sid=s.id) }}">
  <div class="field">
    <label for="date">Date</label>
    <input type="date" id="date" name="date" value="{{ s.date }}" required>
  </div>
  <div class="field">
    <label for="entry_type">Type</label>
    <select id="entry_type" name="entry_type">
      <option value="Deposit" {{ 'selected' if s.entry_type=='Deposit' }}>Deposit</option>
      <option value="FD Transfer" {{ 'selected' if s.entry_type=='FD Transfer' }}>FD Transfer</option>
    </select>
  </div>
  <div class="field">
    <label for="amount">Amount ({{ cur }})</label>
    <input type="number" id="amount" name="amount" step="1" min="0" value="{{ s.amount }}" required>
  </div>
  <div class="field">
    <label for="payment_mode">Payment mode (Deposits only)</label>
    <select id="payment_mode" name="payment_mode">
      {% for m in payment_modes %}<option value="{{ m }}" {{ 'selected' if s.payment_mode==m }}>{{ m }}</option>{% endfor %}
    </select>
  </div>
  <div class="field grow">
    <label for="description">Notes</label>
    <input type="text" id="description" name="description" value="{{ s.description or '' }}">
  </div>
  <div class="field">
    <button class="btn" type="submit">Save changes</button>
  </div>
</form>
{% endblock %}
